  - changeSet:
      id: 003-create-location-policies
      author: codex
      changes:
        - createTable:
            tableName: location_policies
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: tenant_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: agency_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: bin_code
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
              - column:
                  name: product_id
                  type: UUID
              - column:
                  name: min_qty
                  type: INT
              - column:
                  name: max_qty
                  type: INT
              - column:
                  name: safety_stock
                  type: INT
              - column:
                  name: reorder_point
                  type: INT
              - column:
                  name: cycle_count_days
                  type: INT
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
        - createIndex:
            tableName: location_policies
            indexName: ix_location_policies_tenant_agency
            columns:
              - column:
                  name: tenant_id
              - column:
                  name: agency_id
        # Postgres UNIQUE constraints treat NULLs as distinct.
        # Use partial unique indexes to ensure a single "generic" policy per (tenant, agency, bin_code)
        # and a single product-specific policy per (tenant, agency, bin_code, product_id).
        - sql:
            dbms: postgresql
            splitStatements: true
            stripComments: true
            sql: |
              CREATE UNIQUE INDEX IF NOT EXISTS uq_location_policies_generic
              ON location_policies(tenant_id, agency_id, bin_code)
              WHERE product_id IS NULL;
              
              CREATE UNIQUE INDEX IF NOT EXISTS uq_location_policies_product
              ON location_policies(tenant_id, agency_id, bin_code, product_id)
              WHERE product_id IS NOT NULL;

