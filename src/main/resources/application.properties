spring.application.name=comops-core-api

# Server
server.port=${PORT:8080}

# Database (R2DBC for Application)
spring.r2dbc.url=${SPRING_R2DBC_URL:${DB_URL_R2DBC:r2dbc:postgresql://localhost:5432/comops_core}}
spring.r2dbc.username=${SPRING_R2DBC_USERNAME:${DB_USER:postgres}}
spring.r2dbc.password=${SPRING_R2DBC_PASSWORD:${DB_PASSWORD:postgres}}
spring.r2dbc.pool.initial-size=5
spring.r2dbc.pool.max-size=20

# Database (JDBC for Liquibase Migration)
spring.datasource.url=${SPRING_DATASOURCE_URL:${DB_URL_JDBC:jdbc:postgresql://localhost:5432/comops_core}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USER:postgres}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:postgres}}
spring.datasource.driver-class-name=org.postgresql.Driver

# Liquibase
spring.liquibase.enabled=true
spring.liquibase.user=${SPRING_LIQUIBASE_USER:${SPRING_DATASOURCE_USERNAME:${DB_USER:postgres}}}
spring.liquibase.password=${SPRING_LIQUIBASE_PASSWORD:${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:postgres}}}
spring.liquibase.url=${SPRING_LIQUIBASE_URL:${SPRING_DATASOURCE_URL:${DB_URL_JDBC:jdbc:postgresql://localhost:5432/comops_core}}}
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

# Redis (Cache)
spring.data.redis.url=${SPRING_DATA_REDIS_URL:${REDIS_URL:redis://localhost:6379}}
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}

# Logging
logging.level.org.springframework.r2dbc=INFO
logging.level.yowyob.comops=DEBUG

# JWT Security
app.jwt.secret=${APP_JWT_SECRET:${JWT_SECRET:5367566B59703373367639792F423F4528482B4D6251655468576D5A71347437}}
app.jwt.expiration=${APP_JWT_EXPIRATION:86400}

# Jackson format configuration
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

# Swagger UI Configuration
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.api-docs.path=/v3/api-docs
springdoc.show-actuator=true
