spring.application.name=spare-api
server.port=8082

# --- JWT ---
# Must match core-api / stock-api HS256 secret in the environment.
app.jwt.secret=${APP_JWT_SECRET:5367566B59703373367639792F423F4528482B4D6251655468576D5A71347437}

# --- DB (R2DBC) ---
spring.r2dbc.url=${SPRING_R2DBC_URL:r2dbc:postgresql://localhost:5432/comops_spare}
spring.r2dbc.username=${SPRING_R2DBC_USERNAME:postgres}
spring.r2dbc.password=${SPRING_R2DBC_PASSWORD:postgres}
spring.r2dbc.pool.enabled=true

# --- DB (JDBC) for Liquibase ---
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/comops_spare}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

# --- CORS (optional; frontend generally uses same-origin rewrites) ---
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,http://172.23.147.85:3000,https://yow-spare.vercel.app}

management.endpoints.web.exposure.include=health,info

# --- Integrations ---
# Used for availability + analytics aggregation (no stock-api modification required).
app.stock.base-url=${APP_STOCK_BASE_URL:http://localhost:8081}
